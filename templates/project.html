{% extends "base.html" %}
{% block title %}{{ item.judul }}{% endblock %}

{% block content %}
<section class="page-section mt-5">
    <div class="container pt-5">
        <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">{{ item.judul }}</h2>
        <div class="divider-custom">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <img class="img-fluid rounded mb-5" src="{{ url_for('static', filename='assets/img/portfolio/' ~ item.gambar) }}" alt="{{ item.judul }}" />
                <p class="mb-4">{{ item.deskripsi }}</p>
                <a class="btn btn-primary" href="{{ url_for('index') }}">
                    <i class="fas fa-xmark fa-fw"></i> Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
