{% extends "base.html" %}
{% block title %}Beranda{% endblock %}

{% block content %}
<header class="masthead bg-primary text-white text-center">
    <div class="container d-flex align-items-center flex-column">
        <img class="masthead-avatar mb-5" src="{{ url_for('static', filename='assets/img/myprofilgw.jpg') }}" alt="Avatar" />
        <h1 class="masthead-heading text-uppercase mb-0">{{ profil.nama }}</h1>
        <div class="divider-custom divider-light">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
        </div>
        <p class="masthead-subheading font-weight-light mb-0">{{ profil.peran }}</p>
    </div>
</header>

<section class="page-section portfolio" id="portfolio">
    <div class="container">
        <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">Portofolio</h2>
        <div class="divider-custom">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
        </div>

        <div class="row justify-content-center">
            <!-- Data `proyek` dikirim dari app.py, diulang dengan for-loop Jinja -->
            {% for item in proyek %}
            <div class="col-md-6 col-lg-4 mb-5">
                <a href="{{ url_for('detail_proyek', proyek_id=item.id) }}" class="text-decoration-none">
                    <div class="portfolio-item mx-auto">
                        <div class="portfolio-item-caption d-flex align-items-center justify-content-center h-100 w-100">
                            <div class="portfolio-item-caption-content text-center text-white"><i class="fas fa-plus fa-3x"></i></div>
                        </div>
                        <img class="img-fluid" src="{{ url_for('static', filename='assets/img/portfolio/' ~ item.gambar) }}" alt="{{ item.judul }}" />
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
